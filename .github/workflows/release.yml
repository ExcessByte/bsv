name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: |
          mkdir dist
          build() {
            name=$1; arch=$2; shift 2
            env CGO_ENABLED=0 GOOS=linux GOARCH=$arch "$@" \
              go build -trimpath -ldflags="-s -w" -o dist/bsv .
            tar -C dist -czf "dist/bsv-$GITHUB_REF_NAME-$name.tar.gz" bsv
            rm dist/bsv
          }
          build linux-amd64     amd64 GOAMD64=v1
          build linux-arm64     arm64 GOARM64=v8.0
          build linux-arm64-v9  arm64 GOARM64=v9.0
          build linux-armv7     arm   GOARM=7
          cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
